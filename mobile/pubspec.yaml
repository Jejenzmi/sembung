name: sembung_explorer
description: Pendamping digital pendaki & wisatawan Gunung Sembung, Purwakarta.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # state management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # networking & storage
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3

  # map & location
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

  # ui
  qr_flutter: ^4.1.0
  # sensor kompas (magnetometer + akselerometer)
  flutter_compass: ^0.8.0
  # masuk dengan akun Google
  google_sign_in: ^6.2.1
  # pengingat lokal (adzan, H-1 pendakian) — tanpa layanan pihak ketiga
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

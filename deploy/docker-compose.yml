name: sembung

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PORT: 5022
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 30d
      CORS_ORIGIN: ${PUBLIC_URL}
      PAYMENT_MODE: ${PAYMENT_MODE}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      SOS_WEBHOOK_URL: ${SOS_WEBHOOK_URL}
      NODE_ENV: production
      TZ: Asia/Jakarta
      PUBLIC_URL: ${PUBLIC_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:5022/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      # APK di-mount, bukan di-copy ke dalam image, supaya tetap ada setelah
      # rebuild dan bisa diperbarui tanpa membangun ulang web.
      - ./public:/usr/share/nginx/html/unduh:ro
    # Hanya loopback: nginx host yang memegang TLS dan menghadap publik.
    ports:
      - '127.0.0.1:8106:80'

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_URL: ${MINIO_URL}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
      # Read-only: hanya untuk mencadangkan keystore & .env.
      - ./.env:/secrets/deploy.env:ro
      - ../mobile/android/sembung-release.jks:/secrets/sembung-release.jks:ro
      - ../mobile/android/key.properties:/secrets/key.properties:ro
      # mc statis dari host, supaya image backup tidak perlu diubah.
      - /usr/local/bin/mc:/usr/local/bin/mc:ro
    entrypoint: ['sh', '/backup.sh']

volumes:
  pgdata:

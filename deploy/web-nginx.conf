server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # DNS internal Docker, di-resolve ulang tiap 10 detik. Tanpa ini nginx
    # mengunci IP backend saat start, lalu 502 begitu kontainer backend
    # dibangun ulang dan mendapat IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://backend:5022;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash aman di-cache lama; index.html tidak boleh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Berkas APK dipasang lewat volume ./public.
    location = /SembungExplorer.apk {
        alias /usr/share/nginx/html/unduh/SembungExplorer.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="SembungExplorer.apk"';
    }

    # Berkas media dari MinIO, disajikan lewat domain sendiri.
    location /media/ {
        set $media http://minio:9000/sembung-media/;
        proxy_pass $media;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # Socket.IO untuk notifikasi SOS & kapasitas real-time.
    location /socket.io/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA: rute klien seperti /reports dilayani index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
